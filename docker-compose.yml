version: '3.8'

services:
  # Qdrant Vector DB
  qdrant:
    image: qdrant/qdrant:latest
    container_name: analyst-ai-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__MAX_REQUEST_SIZE_MB=32
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=4
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - analyst-ai-network
    restart: unless-stopped

  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: analyst-ai-app
    ports:
      - "${ANALYST_AI_PORT:-8000}:8000"
    environment:
      # Database Configuration (Common - shared across services)
      # Uses DATABASE_URL from .env file
      # For Docker environments, ensure your .env file uses host.docker.internal instead of localhost
      # Example: postgresql://user:password@host.docker.internal:5433/dbname?schema=public&connection_limit=20&pool_timeout=30&connect_timeout=10
      DATABASE_URL: ${DATABASE_URL}

      # Redis Configuration (Common - shared across services)
      # Uses external Redis via environment variables
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}

      # LLM Provider API Keys (Common - shared across services)
OPENAI_API_KEY=REDACTED
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}

      # Global LLM Configuration
      GLOBAL_LLM_PROVIDER: ${GLOBAL_LLM_PROVIDER:-openai}
      GLOBAL_LLM_MODEL: ${GLOBAL_LLM_MODEL:-gpt-4}

      # AWS Configuration (Common - shared across services)
      AWS_REGION: ${AWS_REGION}
AWS_ACCESS_KEY_ID=REDACTED
AWS_SECRET_ACCESS_KEY=REDACTED
      AWS_COGNITO_USER_POOL_ID: ${AWS_COGNITO_USER_POOL_ID}
      DYNAMODB_TABLE: ${DYNAMODB_TABLE}

      # Application Configuration
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Vector DB (Qdrant)
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-conversation_messages}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/paraphrase-MiniLM-L3-v2}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-384}
      QDRANT_SCORE_THRESHOLD: ${QDRANT_SCORE_THRESHOLD:-0.3}
      # Conversation Context Configuration
      CONTEXT_K_RECENT: ${CONTEXT_K_RECENT:-10}
      CONTEXT_R_RETRIEVED: ${CONTEXT_R_RETRIEVED:-5}

    depends_on:
      qdrant:
        condition: service_started
    networks:
      - analyst-ai-network
    volumes:
      # Mount code for development (comment out for production)
      - .:/app
      # Exclude node_modules and __pycache__
      - /app/__pycache__
      - /app/.pytest_cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  analyst-ai-network:
    driver: bridge

volumes:
  qdrant_data:
    driver: local
