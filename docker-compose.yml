version: '3.8'

services:
  app:
    build: .
    container_name: analyst-ai-app
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./requirements.txt
