version: '3.8'

services:
  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: analyst-ai-app
    env_file:
      - .env
    ports:
      - "${ANALYST_AI_PORT:-8000}:8000"
    # All environment variables are loaded from .env file via env_file above
    # You can override specific variables here if needed:
    # environment:
    #   - LOG_LEVEL=INFO
    networks:
      - analyst-ai-network
    volumes:
      # Mount code for development (comment out for production)
      - .:/app
      # Exclude node_modules and __pycache__
      - /app/__pycache__
      - /app/.pytest_cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  analyst-ai-network:
    driver: bridge
