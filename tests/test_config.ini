# Test Configuration
# This file contains configuration settings for running tests

[test_settings]
# Test timeout in seconds
timeout = 60

# Test output verbosity (0=quiet, 1=normal, 2=verbose)
verbosity = 1

# Skip tests that require external services
skip_external = false

# Test data directory
test_data_dir = tests/data

[providers]
# Test providers and their mock API keys
openai_key = test-openai-key
google_key = test-google-key
anthropic_key = test-anthropic-key

[models]
# Test models for each provider
openai_models = gpt-3.5-turbo,gpt-4
gemini_models = gemini-pro,gemini-1.5-pro
claude_models = claude-3-sonnet-20240229,claude-3-haiku-20240307
