name: Ally Push to Dev

on:
  push:
    branches: [dev]

jobs:
  build_and_push:
    name: Build and Push Ally to ECR (dev)
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-north-1
      ECR_REPOSITORY: ally_dev
      MS_TEAMS_WEBHOOK_URL_ALERT: ${{ secrets.MS_TEAMS_WEBHOOK_URL_ALERT }}
    permissions:
      id-token: write
      contents: read

    outputs:
      start_ts: ${{ steps.capture_start.outputs.ts }}

    steps:
      - id: capture_start
        name: Capture start time
        run: echo "ts=$(date -u +%s)" >> "$GITHUB_OUTPUT"
        
      - name: Notify Teams (started)
        if: ${{ env.MS_TEAMS_WEBHOOK_URL_ALERT != '' }}
        run: |
          MESSAGE=$(cat <<EOF
          🚀 **${{ github.workflow }}** started on \`${{ github.ref_name }}\` by **${{ github.actor }}**
          
          **Repo:** \`${{ github.repository }}\` • **Run:** #${{ github.run_number }}
          **Service:** \`${ECR_REPOSITORY}\`
          
          🔗 [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF
          )
          
          echo "$MESSAGE" | jq -Rs '{
            "type": "AdaptiveCard",
            "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
            "version": "1.4",
            "body": [
              {
                "type": "TextBlock",
                "text": .,
                "wrap": true
              }
            ]
          }' | curl -sS -H "Content-Type: application/json" -d @- "$MS_TEAMS_WEBHOOK_URL_ALERT"

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::194317476708:role/GitHubActionsECRRole
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          output-env-credentials: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION"

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          # Generate date tag in DDMMYYYY format (e.g., 25122024)
          DATE_TAG=$(date +'%d%m%Y')
          IMAGE_TAG="ally_dev_${DATE_TAG}"
          ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          echo "🔨 Building image with BuildKit cache: ${ECR_IMAGE}:${IMAGE_TAG}"

          # Check if latest tag exists and remove it from the previous image
          echo "🔄 Handling latest tag..."
          LATEST_EXISTS=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag=latest \
            --region "$AWS_REGION" \
            --query 'length(imageDetails)' \
            --output text 2>/dev/null || echo "0")

          if [ "$LATEST_EXISTS" != "0" ] && [ "$LATEST_EXISTS" != "None" ]; then
            echo "🗑️ Removing latest tag from previous image"
            aws ecr batch-delete-image \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag=latest \
              --region "$AWS_REGION" || true
          else
            echo "ℹ️ No existing latest tag found"
          fi

          # Build and push Docker image
          docker build -f Dockerfile -t "${ECR_IMAGE}:${IMAGE_TAG}" -t "${ECR_IMAGE}:latest" .
          docker push "${ECR_IMAGE}:${IMAGE_TAG}"
          docker push "${ECR_IMAGE}:latest"

          echo "✅ Successfully pushed ${ECR_IMAGE}:${IMAGE_TAG} and ${ECR_IMAGE}:latest"

  notify_dev:
    name: Notify Teams (completed)
    runs-on: ubuntu-latest
    needs: build_and_push
    if: always()
    env:
      MS_TEAMS_WEBHOOK_URL_ALERT: ${{ secrets.MS_TEAMS_WEBHOOK_URL_ALERT }}
    steps:
      - name: Send completion alert
        if: ${{ env.MS_TEAMS_WEBHOOK_URL_ALERT != '' }}
        run: |
          RESULT="${{ needs.build_and_push.result }}"  # success | failure | cancelled
          if [ "$RESULT" = "success" ]; then
            EMOJI="✅"
          elif [ "$RESULT" = "failure" ]; then
            EMOJI="❌"
          elif [ "$RESULT" = "cancelled" ]; then
            EMOJI="🚫"
          else
            EMOJI="ℹ️"
          fi

          START_TS="${{ needs.build_and_push.outputs.start_ts }}"
          END_TS=$(date -u +%s)
          DUR=$(( END_TS - START_TS ))
          printf -v DUR_HMS '%02d:%02d:%02d' $((DUR/3600)) $(((DUR%3600)/60)) $((DUR%60))

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          MESSAGE=$(cat <<EOF
          $EMOJI **${{ github.workflow }} • $RESULT**

          **Repository:** ${{ github.repository }}
          **Branch:** ${{ github.ref_name }}
          **Run:** #${{ github.run_number }}
          **By:** ${{ github.actor }}
          **Duration:** $DUR_HMS

          🔗 [View Logs]($RUN_URL)
          EOF
          )

          echo "$MESSAGE" | jq -Rs '{
            "type": "AdaptiveCard",
            "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
            "version": "1.4",
            "body": [
              {
                "type": "TextBlock",
                "text": .,
                "wrap": true
              }
            ]
          }' | curl -sS -H "Content-Type: application/json" -d @- "$MS_TEAMS_WEBHOOK_URL_ALERT"